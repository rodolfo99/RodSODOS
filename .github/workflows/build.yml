name: RodOS 0.1.3 - BIOS y UEFI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compiladores y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang lld python3 make
      - name: Compilar kernel BIOS, UEFI x64 e imagen USB; ejecutar tests
        run: make -j2 test
      - name: Guardar imagen experimental USB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RodOS-0.1.3-BIOS-UEFI-USB
          path: build/RodOS-0.1.3-BIOS-UEFI-USB.iso
          retention-days: 7
